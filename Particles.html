<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Tracked 3D Particle Morphing</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 42%, rgba(22, 48, 88, 0.28), transparent 52%),
                #050712;
            color: #f5f7ff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        canvas { display: block; }
        #video-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 176px;
            height: 132px;
            z-index: 10;
            border: 1px solid rgba(171, 203, 255, 0.35);
            border-radius: 16px;
            overflow: hidden;
            transform: scaleX(-1);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35), 0 0 24px rgba(91, 128, 255, 0.12);
            background: #101525;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #f5f7ff;
            background: rgba(12, 16, 32, 0.68);
            border: 1px solid rgba(176, 191, 255, 0.18);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 18px 20px;
            border-radius: 18px;
            pointer-events: none;
            text-align: right;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.24);
        }
        h1 { font-size: 1.08rem; letter-spacing: 0.02em; margin: 0 0 9px; }
        #ui p { font-size: 0.79rem; line-height: 1.5; margin: 0; color: #bac4df; }
        #ui p.current-shape { margin-top: 9px; color: #e8eaff; }
        #shape-name { color: #aeb8ff; font-weight: 700; }
        .status { margin-top: 12px; font-size: 0.76rem; font-weight: 700; color: #77f2c2; }
        .shape-picker {
            position: absolute;
            z-index: 10;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            width: min(680px, calc(100vw - 40px));
            padding: 16px;
            border: 1px solid rgba(177, 190, 255, 0.2);
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(18, 23, 43, 0.88), rgba(12, 16, 31, 0.78));
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.38), 0 0 42px rgba(99, 109, 255, 0.1);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }
        .picker-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 2px 12px;
        }
        .picker-title { margin: 0; font-size: 0.8rem; font-weight: 750; letter-spacing: 0.12em; text-transform: uppercase; color: #dce2ff; }
        .picker-hint { margin: 0; color: #8d98b8; font-size: 0.72rem; }
        .shape-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
        .shape-option {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid rgba(171, 185, 230, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.035);
            color: #b8c0d9;
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: transform 180ms ease, color 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
        }
        .shape-option:hover {
            transform: translateY(-2px);
            color: #fff;
            border-color: rgba(164, 174, 255, 0.45);
            background: rgba(118, 127, 255, 0.12);
        }
        .shape-option:focus-visible { outline: 2px solid #aab3ff; outline-offset: 2px; }
        .shape-option[aria-pressed="true"] {
            color: #fff;
            border-color: rgba(154, 163, 255, 0.82);
            background: linear-gradient(135deg, rgba(112, 105, 255, 0.3), rgba(59, 195, 221, 0.13));
            box-shadow: inset 0 0 0 1px rgba(194, 198, 255, 0.12), 0 0 22px rgba(109, 111, 255, 0.16);
        }
        .shape-icon {
            display: grid;
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 11px;
            background: rgba(161, 171, 255, 0.1);
            font-size: 1.1rem;
        }
        .shape-option[aria-pressed="true"] .shape-icon { background: rgba(184, 190, 255, 0.2); }
        .shape-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.82rem; font-weight: 650; }
        @media (max-width: 620px) {
            #video-container { top: 12px; left: 12px; width: 112px; height: 84px; border-radius: 12px; }
            #ui { top: 12px; right: 12px; padding: 12px 14px; border-radius: 14px; }
            h1 { font-size: 0.92rem; margin-bottom: 5px; }
            #ui p { font-size: 0.68rem; }
            #ui p.current-shape { margin-top: 5px; }
            .status { margin-top: 7px; font-size: 0.68rem; }
            .shape-picker { bottom: 12px; width: calc(100vw - 24px); padding: 12px; border-radius: 18px; }
            .picker-heading { margin-bottom: 9px; }
            .picker-title { font-size: 0.72rem; }
            .picker-hint { font-size: 0.64rem; }
            .shape-options { gap: 6px; }
            .shape-option { flex-direction: column; justify-content: center; gap: 5px; padding: 8px 4px; border-radius: 12px; }
            .shape-icon { flex-basis: 30px; width: 30px; height: 30px; border-radius: 9px; font-size: 1rem; }
            .shape-label { max-width: 100%; font-size: 0.66rem; }
        }
        @media (max-width: 380px) {
            .picker-hint { display: none; }
            .shape-label { font-size: 0.61rem; }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" playsinline></video>
    </div>

    <div id="ui" aria-live="polite">
        <h1>Particle Morpher</h1>
        <p>🖐 Move hand to guide particles</p>
        <p>👌 Pinch to expand the shape</p>
        <p class="current-shape">Selected: <span id="shape-name">Sphere</span></p>
        <div id="loading" class="status">Loading AI Model...</div>
    </div>

    <section class="shape-picker" aria-label="Choose a particle shape">
        <div class="picker-heading">
            <h2 class="picker-title">Choose your form</h2>
            <p class="picker-hint">Select a shape to morph the particles</p>
        </div>
        <div class="shape-options">
            <button class="shape-option" type="button" data-shape="sphere" aria-pressed="true"><span class="shape-icon" aria-hidden="true">◉</span><span class="shape-label">Sphere</span></button>
            <button class="shape-option" type="button" data-shape="heart" aria-pressed="false"><span class="shape-icon" aria-hidden="true">♥</span><span class="shape-label">Heart</span></button>
            <button class="shape-option" type="button" data-shape="saturn" aria-pressed="false"><span class="shape-icon" aria-hidden="true">🪐</span><span class="shape-label">Saturn</span></button>
            <button class="shape-option" type="button" data-shape="flower" aria-pressed="false"><span class="shape-icon" aria-hidden="true">✿</span><span class="shape-label">Flower</span></button>
            <button class="shape-option" type="button" data-shape="galaxy" aria-pressed="false"><span class="shape-icon" aria-hidden="true">✧</span><span class="shape-label">Galaxy</span></button>
            <button class="shape-option" type="button" data-shape="torus" aria-pressed="false"><span class="shape-icon" aria-hidden="true">◌</span><span class="shape-label">Torus</span></button>
            <button class="shape-option" type="button" data-shape="cube" aria-pressed="false"><span class="shape-icon" aria-hidden="true">⬡</span><span class="shape-label">Cube</span></button>
            <button class="shape-option" type="button" data-shape="diamond" aria-pressed="false"><span class="shape-icon" aria-hidden="true">◇</span><span class="shape-label">Diamond</span></button>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 15000;
        const PARTICLE_SIZE = 0.08;
        const TRANSITION_SPEED = 0.05; // 0 to 1, how fast shapes morph

        // --- GLOBALS ---
        let scene, camera, renderer, points;
        let positionsOriginal, positionsTarget; // Float32Arrays for morphing
        let colors;
        let geometry;
        let clock = new THREE.Clock();
        
        // Interaction State
        let handPosition = new THREE.Vector3(0, 0, 0);
        let expansionFactor = 0; // 0 = normal, 1 = fully expanded
        let isHandDetected = false;
        let currentShape = 'sphere';
        // --- SHAPE MATH FORMULAS ---
        const MathUtils = {
            sphere: (i) => {
                const r = 2 + Math.random() * 0.5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                return {
                    x: r * Math.sin(phi) * Math.cos(theta),
                    y: r * Math.sin(phi) * Math.sin(theta),
                    z: r * Math.cos(phi)
                };
            },
            heart: (i) => {
                // Heart Surface Parametric
                // x = 16sin^3(t)
                // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                // We map this to 3D roughly
                const t = Math.random() * Math.PI * 2;
                const r = Math.random(); // volume filler
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const z = (Math.random() - 0.5) * 4; // Thickness
                const scale = 0.15;
                return { x: x * scale, y: y * scale, z: z };
            },
            saturn: (i) => {
                const isRing = Math.random() > 0.3; // 70% particles in ring
                if (isRing) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 3 + Math.random() * 1.5;
                    return {
                        x: Math.cos(angle) * dist,
                        y: (Math.random() - 0.5) * 0.2, // Flat ring
                        z: Math.sin(angle) * dist
                    };
                } else {
                    // Planet body
                    const r = 1.5;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    return {
                        x: r * Math.sin(phi) * Math.cos(theta),
                        y: r * Math.sin(phi) * Math.sin(theta),
                        z: r * Math.cos(phi)
                    };
                }
            },
            flower: (i) => {
                // Spherical sine wave modulation
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI;
                const r = 2 + Math.sin(5 * u) * Math.sin(5 * v); // 5 petals
                return {
                    x: r * Math.sin(v) * Math.cos(u),
                    y: r * Math.sin(v) * Math.sin(u),
                    z: r * Math.cos(v)
                };
            },
            galaxy: (i) => {
                const arm = Math.floor(Math.random() * 3);
                const radius = Math.sqrt(Math.random()) * 4.2;
                const angle = radius * 1.35 + arm * (Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.45;
                return {
                    x: Math.cos(angle) * radius,
                    y: (Math.random() - 0.5) * (0.18 + radius * 0.08),
                    z: Math.sin(angle) * radius
                };
            },
            torus: (i) => {
                const angle = Math.random() * Math.PI * 2;
                const tubeAngle = Math.random() * Math.PI * 2;
                const majorRadius = 2.35;
                const minorRadius = 0.72;
                const ring = majorRadius + minorRadius * Math.cos(tubeAngle);
                return {
                    x: ring * Math.cos(angle),
                    y: minorRadius * Math.sin(tubeAngle),
                    z: ring * Math.sin(angle)
                };
            },
            cube: (i) => {
                const face = Math.floor(Math.random() * 6);
                const x = (Math.random() - 0.5) * 4;
                const y = (Math.random() - 0.5) * 4;
                const z = (Math.random() - 0.5) * 4;
                return {
                    x: face < 2 ? (face === 0 ? -2 : 2) : x,
                    y: face >= 2 && face < 4 ? (face === 2 ? -2 : 2) : y,
                    z: face >= 4 ? (face === 4 ? -2 : 2) : z
                };
            },
            diamond: (i) => {
                const y = (Math.random() * 2 - 1) * 2.8;
                const taper = 1 - Math.abs(y) / 3.1;
                const angle = Math.random() * Math.PI * 2;
                const radius = (0.25 + Math.random() * 1.65) * taper;
                return {
                    x: Math.cos(angle) * radius,
                    y,
                    z: Math.sin(angle) * radius
                };
            }
        };

        // --- THREE.JS SETUP ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.05);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 8;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Create Particles
            geometry = new THREE.BufferGeometry();
            positionsOriginal = new Float32Array(PARTICLE_COUNT * 3);
            positionsTarget = new Float32Array(PARTICLE_COUNT * 3); // Where they want to go
            colors = new Float32Array(PARTICLE_COUNT * 3);

            const posAttribute = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Initialize as Sphere
                const p = MathUtils.sphere(i);
                positionsOriginal[i * 3] = p.x;
                positionsOriginal[i * 3 + 1] = p.y;
                positionsOriginal[i * 3 + 2] = p.z;
                
                // Copy to render buffer
                posAttribute[i * 3] = p.x;
                posAttribute[i * 3 + 1] = p.y;
                posAttribute[i * 3 + 2] = p.z;

                // Set initial target same as original
                positionsTarget[i * 3] = p.x;
                positionsTarget[i * 3 + 1] = p.y;
                positionsTarget[i * 3 + 2] = p.z;

                // Color gradient (Teal to Purple)
                colors[i * 3] = 0.2 + Math.random() * 0.5; // R
                colors[i * 3 + 1] = 0.5 + Math.random() * 0.5; // G
                colors[i * 3 + 2] = 1.0; // B
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(posAttribute, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Custom Shader Material for prettier points
            const material = new THREE.PointsMaterial({
                size: PARTICLE_SIZE,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);

            // Ambient Light
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            window.addEventListener('resize', onWindowResize, false);
            
        }

        function selectShape(shapeName) {
            if (!Object.prototype.hasOwnProperty.call(MathUtils, shapeName)) {
                throw new Error(`Unknown particle shape: ${shapeName}`);
            }

            currentShape = shapeName;
            document.getElementById('shape-name').innerText = shapeName.charAt(0).toUpperCase() + shapeName.slice(1);
            document.querySelectorAll('.shape-option').forEach((button) => {
                const isSelected = button.dataset.shape === shapeName;
                button.setAttribute('aria-pressed', String(isSelected));
            });
            calculateTargetPositions(currentShape);
        }

        function calculateTargetPositions(shapeName) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = MathUtils[shapeName](i);
                positionsTarget[i * 3] = p.x;
                positionsTarget[i * 3 + 1] = p.y;
                positionsTarget[i * 3 + 2] = p.z;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const positions = geometry.attributes.position.array;
            const time = clock.getElapsedTime();

            // Smoothly move hand position (Lerp)
            // If hand is lost, drift back to center
            const targetPos = isHandDetected ? handPosition : new THREE.Vector3(0,0,0);
            
            // Rotate the entire system slightly
            points.rotation.y += 0.002;
            points.rotation.z += 0.001;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                // 1. Morph Logic: Interpolate current position toward target shape position
                // We do this by updating the "Original" reference, which acts as the base shape state
                positionsOriginal[ix] += (positionsTarget[ix] - positionsOriginal[ix]) * TRANSITION_SPEED;
                positionsOriginal[iy] += (positionsTarget[iy] - positionsOriginal[iy]) * TRANSITION_SPEED;
                positionsOriginal[iz] += (positionsTarget[iz] - positionsOriginal[iz]) * TRANSITION_SPEED;

                // 2. Physics Logic: Expansion based on Pinch
                // Calculate direction from center (0,0,0)
                let px = positionsOriginal[ix];
                let py = positionsOriginal[iy];
                let pz = positionsOriginal[iz];

                // Add Hand Offset
                // We apply the hand offset to the final render position, not the shape calculation
                // This makes the shape "follow" the hand
                
                // Expansion/Explosion Effect
                // If expansionFactor is high, push particles outward from center
                const expansionMultiplier = 1 + (expansionFactor * 3.0); 
                
                // Add some noise for "firework" jitter when expanded
                const noise = expansionFactor > 0.1 ? (Math.random() - 0.5) * expansionFactor * 0.5 : 0;

                positions[ix] = (px * expansionMultiplier) + targetPos.x + noise;
                positions[iy] = (py * expansionMultiplier) + targetPos.y + noise;
                positions[iz] = (pz * expansionMultiplier) + targetPos.z + noise;

                // Dynamic Color: Shift to Red/Orange on pinch
                const r = colors[i * 3];
                const g = colors[i * 3 + 1];
                const b = colors[i * 3 + 2];
                
                // Base color + red shift on pinch
                geometry.attributes.color.array[i * 3] = THREE.MathUtils.lerp(r, 1.0, expansionFactor); // R goes high
                geometry.attributes.color.array[i * 3 + 1] = THREE.MathUtils.lerp(g, 0.2, expansionFactor); // G goes low
                geometry.attributes.color.array[i * 3 + 2] = THREE.MathUtils.lerp(b, 0.0, expansionFactor); // B goes low
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // --- MEDIAPIPE HANDS SETUP ---
        function initMediaPipe() {
            const videoElement = document.getElementById('video');
            
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            
            cameraUtils.start()
                .then(() => {
                    document.getElementById('loading').innerText = "System Ready - Show Hand";
                    document.getElementById('loading').style.color = "#00ff88";
                })
                .catch(err => {
                    document.getElementById('loading').innerText = "Camera Error";
                    console.error(err);
                });
        }

        function onHandsResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const landmarks = results.multiHandLandmarks[0];

                // 1. Calculate Hand Position (Index Finger Tip is #8)
                // Coordinates are normalized [0,1]. We map to Three.js world space
                // X needs to be inverted because webcam is mirrored
                const x = (1 - landmarks[8].x) * 2 - 1; 
                const y = -(landmarks[8].y * 2 - 1); 
                
                // Map [-1, 1] to a visible range in our scene (roughly -5 to 5)
                handPosition.x = x * 6;
                handPosition.y = y * 4;
                handPosition.z = 0; // Keeping Z flat for simplicity

                // 2. Detect Pinch (Distance between Thumb Tip #4 and Index Tip #8)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                
                const distance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) +
                    Math.pow(thumbTip.y - indexTip.y, 2)
                );

                // Determine Pinch Strength
                // Distance usually ranges from 0.02 (touching) to 0.2 (open)
                // We want: Close = 1 (Explode), Open = 0 (Normal)
                // Let's invert the logic: Pinching = Concentration? Or Pinching = Squeeze/Explode?
                // Request said: "control particle behavior including expansion".
                // Let's make Pinching (Touch) = Contract/Hold, Opening = Explode? 
                // Actually, physically, pinching feels like grabbing. 
                // Let's do: Distance < 0.05 -> Expansion = 1.0 (Explosion)
                
                // Clamping and mapping
                // If dist < 0.05 (pinch), expansion = 1.
                // If dist > 0.15 (open), expansion = 0.
                let strength = THREE.MathUtils.mapLinear(distance, 0.03, 0.15, 1.0, 0.0);
                strength = THREE.MathUtils.clamp(strength, 0, 1);
                
                // Smooth the value
                expansionFactor = THREE.MathUtils.lerp(expansionFactor, strength, 0.1);

            } else {
                isHandDetected = false;
                expansionFactor = THREE.MathUtils.lerp(expansionFactor, 0, 0.05);
            }
        }

        // --- BOOTSTRAP ---
        initThree();
        document.querySelectorAll('.shape-option').forEach((button) => {
            button.addEventListener('click', () => selectShape(button.dataset.shape));
        });
        selectShape(currentShape);
        initMediaPipe();
        animate();

    </script>
</body>
</html>
